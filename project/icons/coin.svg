<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 52 52" width="104" height="104" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><filter id="grit" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="4" result="t"></feTurbulence><feColorMatrix in="t" type="saturate" values="0" result="m"></feColorMatrix><feComponentTransfer in="m" result="n"><feFuncR type="linear" slope=".42" intercept=".7"></feFuncR><feFuncG type="linear" slope=".42" intercept=".7"></feFuncG><feFuncB type="linear" slope=".42" intercept=".7"></feFuncB></feComponentTransfer><feBlend in="SourceGraphic" in2="n" mode="multiply" result="b"></feBlend><feComposite in="b" in2="SourceGraphic" operator="in"></feComposite></filter>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"></feGaussianBlur></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"></feGaussianBlur></filter>
<filter id="drop" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity=".6"></feDropShadow></filter>
<filter id="metal" x="-15%" y="-15%" width="130%" height="135%"><feGaussianBlur in="SourceAlpha" stdDeviation="2" result="b"></feGaussianBlur><feSpecularLighting in="b" surfaceScale="3" specularConstant=".55" specularExponent="16" lighting-color="#fff" result="s"><fePointLight x="-40" y="-80" z="180"></fePointLight></feSpecularLighting><feComposite in="s" in2="SourceAlpha" operator="in" result="s2"></feComposite><feComposite in="SourceGraphic" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".55" k4="0" result="lit"></feComposite><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="9" result="t"></feTurbulence><feColorMatrix in="t" type="saturate" values="0" result="m"></feColorMatrix><feComponentTransfer in="m" result="n"><feFuncR type="linear" slope=".3" intercept=".78"></feFuncR><feFuncG type="linear" slope=".3" intercept=".78"></feFuncG><feFuncB type="linear" slope=".3" intercept=".78"></feFuncB></feComponentTransfer><feBlend in="lit" in2="n" mode="multiply" result="g1"></feBlend><feComposite in="g1" in2="SourceAlpha" operator="in" result="g2"></feComposite><feDropShadow in="g2" dx="0" dy="2.5" stdDeviation="1.8" flood-color="#000" flood-opacity=".45"></feDropShadow></filter></defs><g filter="url(#drop)"><circle cx="24" cy="24" r="19" fill="#D9B04C"></circle><circle cx="24" cy="24" r="14" fill="#B8913A"></circle><text x="24" y="30" font-size="17" fill="#F0D27A" text-anchor="middle" font-family="Arial Narrow, Roboto Condensed, Arial, sans-serif" font-weight="700">$</text></g></svg>