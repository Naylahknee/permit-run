<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 0 1000 280" width="1000" height="280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><filter id="grit" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="4" result="t"></feTurbulence><feColorMatrix in="t" type="saturate" values="0" result="m"></feColorMatrix><feComponentTransfer in="m" result="n"><feFuncR type="linear" slope=".42" intercept=".7"></feFuncR><feFuncG type="linear" slope=".42" intercept=".7"></feFuncG><feFuncB type="linear" slope=".42" intercept=".7"></feFuncB></feComponentTransfer><feBlend in="SourceGraphic" in2="n" mode="multiply" result="b"></feBlend><feComposite in="b" in2="SourceGraphic" operator="in"></feComposite></filter>
