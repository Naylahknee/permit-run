name: Secret exposure scan
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch branches and tags
        run: git fetch --no-recurse-submodules origin '+refs/heads/*:refs/remotes/origin/*' --tags
      - name: Install checksum-verified Gitleaks
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan current code
        run: '"$RUNNER_TEMP/gitleaks" dir --redact .'
      - name: Scan all fetched Git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --log-opts="--all" .'
