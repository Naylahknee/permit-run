<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Permit Run</title>
<meta name="description" content="A calm, game-style way to study for the California driver's permit test.">
<meta name="theme-color" content="#F5F3EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Permit Run">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/brand/app-icon-1024.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
// The current Permit Run is the default for everyone, including returning players.
// A person can still explicitly choose Classic. The latest-version link also
// remembers that choice without deleting saved game progress.
try {
  var requestedDesign = new URLSearchParams(location.search).get('design');
  if (requestedDesign === 'new' || requestedDesign === 'classic') {
    localStorage.setItem('permitrun.design', requestedDesign);
  }
  var chosenDesign = localStorage.getItem('permitrun.design');
  if (chosenDesign === 'classic' && requestedDesign !== 'new') {
    location.replace('classic/');
  }
} catch (e) {}
</script>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app" class="screen"></main>
<noscript>Permit Run needs JavaScript turned on.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
