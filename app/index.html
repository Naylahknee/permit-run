<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Permit Run</title>
<meta name="description" content="A calm, game-style way to study for the California driver's permit test.">
<meta name="theme-color" content="#F5F3EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Permit Run">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/brand/app-icon-1024.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
// Two designs share this site: this one, and the original dark game in classic/.
// Players who picked classic (or who played before the redesign and never
// picked) go straight there. Progress is shared, so switching loses nothing.
try {
  var d = localStorage.getItem('permitrun.design');
  if (!d) { var s = JSON.parse(localStorage.getItem('permitrun.v1') || 'null'); if (s && s.started && !s.attempts) d = 'classic'; }
  if (d === 'classic') location.replace('classic/');
} catch (e) {}
</script>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app" class="screen"></main>
<noscript>Permit Run needs JavaScript turned on.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
